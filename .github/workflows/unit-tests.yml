name: unit-tests

# Fast, dataset-free unit tests for the shared helpers in scripts/ml_utils.py.
# Complements smoke-test.yml (which only proves the pipeline produces outputs).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -q
